<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Teachers — Browse & Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-icon" aria-hidden="true">🎓</span>
        <span>Teacher Directory</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html" class="nav-link active">Browse Teachers</a>
        <a href="submit.html" class="nav-link">Add Yourself</a>
        <a href="admin.html" class="nav-link">Moderate</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Find a Recommended Teacher</h1>
      <p>Search and filter our community-curated list of tutors by subject, grade, board, teaching mode, or locality.</p>
    </div>

    <section class="filter-panel" aria-label="Search and filters">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="Search by teacher name, subject, locality, grade, or comments..."
            autocomplete="off"
          />
        </div>
        <button type="button" id="resetFiltersBtn" class="btn btn-secondary">Reset</button>
      </div>

      <div class="filter-grid">
        <div class="filter-field">
          <label for="subjectFilter">Subject</label>
          <select id="subjectFilter">
            <option value="">All Subjects</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="boardFilter">Board</label>
          <select id="boardFilter">
            <option value="">All Boards</option>
            <option value="CBSE">CBSE</option>
            <option value="ICSE">ICSE</option>
            <option value="IGCSE">IGCSE</option>
            <option value="IB">IB</option>
            <option value="State Board">State Board</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="modeFilter">Mode of Teaching</label>
          <select id="modeFilter">
            <option value="">Any Mode</option>
            <option value="Online">Online</option>
            <option value="Offline">Offline</option>
            <option value="Hybrid">Hybrid (Online &amp; Offline)</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="localityFilter">Locality (Offline)</label>
          <select id="localityFilter">
            <option value="">All Localities</option>
          </select>
        </div>
      </div>
    </section>

    <div class="results-toolbar">
      <div id="resultsCount" class="results-count">Loading teachers...</div>
      <div class="view-toggle" role="group" aria-label="View layout">
        <button type="button" id="cardViewBtn" class="active">Cards</button>
        <button type="button" id="tableViewBtn">Table</button>
      </div>
    </div>

    <div id="resultsContainer">
      <div class="state-box">
        <div class="spinner"></div>
        <div>Loading teacher directory from Google Sheets...</div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/browse.js"></script>
</body>
</html>
